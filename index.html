<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2057d5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="你的私人梗圖收藏，從關鍵字找到對的回覆。"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><title>梗圖庫 · MemeFinder</title></head><body><header><a href="#/search" class="brand"><img src="icon.svg" alt="">梗圖庫 <small>MemeFinder</small></a><button id="connect" class="primary">連線 Google</button></header><main id="main"></main><nav aria-label="主要導覽"><a href="#/search">⌕<span>搜尋</span></a><a href="#/tag">▧<span>標記</span></a><a href="#/upload">＋<span>上傳</span></a><a href="#/settings">⚙<span>設定</span></a></nav><dialog id="viewer"><div class="viewhead"><span id="viewtitle"></span><button id="closeview" aria-label="關閉預覽">✕</button></div><div id="stage"><img id="fullimg" alt="圖片預覽"></div><div class="zoom"><button id="minus">−</button><button id="resetzoom">還原</button><button id="plus">＋</button></div><div class="viewactions"><button id="copy" class="primary" disabled>圖片準備中</button><button id="share">分享</button><button id="download">下載原圖</button><button id="edit">編輯標記</button></div></dialog><dialog id="editor"><form id="editform"><div class="viewhead"><strong>編輯標記</strong><button type="button" id="closeedit">✕</button></div><div id="conflict"></div><label>圖片名稱<input name="title"></label><label>關鍵字（逗號分隔）<input name="tags" placeholder="傻眼、貓、問號"></label><div id="suggestions" class="chips"></div><label>使用場景<textarea name="scene" placeholder="同事提出奇怪要求、朋友講冷笑話"></textarea></label><label>回覆語句／提示詞<input name="phrase" placeholder="你認真嗎"></label><label>圖中文字<textarea name="text"></textarea></label><label class="check"><input type="checkbox" name
